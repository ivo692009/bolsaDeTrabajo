skill:
  id: "skill_template"
  version: "1.0.0"
  name: "Nombre de la skill"
  owner: "Equipo o persona responsable"
  status: "draft"
  implementation_status: "not_implemented"
  description: "Descripción breve de la finalidad de la skill."
  purpose: "Qué problema resuelve y para qué tipo de usuario."

  trigger:
    type: "manual"
    conditions:
      - "Se activa cuando el usuario solicita una acción específica."
      - "También puede dispararse por evento o llamada externa."

  dependencies:
    - name: "Fuente o permiso requerido"
      required: true
      failure_behavior: "Detener la acción protegida y escalar sin inventar un resultado."

  inputs:
    - name: "usuario"
      type: "string"
      required: true
      description: "Identificación del usuario o contexto de la consulta."
    - name: "solicitud"
      type: "string"
      required: true
      description: "Texto o instrucción recibida por el usuario."
    - name: "contexto"
      type: "object"
      required: false
      description: "Información adicional del negocio o del sistema."

  outputs:
    - name: "respuesta"
      type: "string"
      description: "Respuesta final para el usuario."
    - name: "acciones"
      type: "array"
      description: "Lista de pasos o decisiones sugeridas."

  instructions:
    - "Actúa con claridad, precisión y coherencia con el negocio."
    - "No inventes datos que no estén disponibles en el contexto."
    - "Si faltan datos clave, solicita la información necesaria antes de responder."
    - "Respeta el tono y la política de la organización."

  guardrails:
    - "No compartas información sensible sin autorización."
    - "No des recomendaciones fuera del alcance del proyecto."
    - "No asumas decisiones sin validar los datos disponibles."

  failure_handling:
    ambiguous_input: "Solicitar el dato mínimo que resuelve la ambigüedad."
    missing_or_invalid_data: "No ejecutar la acción; explicar el siguiente paso disponible."
    dependency_unavailable: "Aplicar fallback seguro o dejar pendiente; no simular éxito."
    persistence_uncertain: "Consultar estado/idempotencia antes de reintentar."
    escalation: "Indicar rol responsable, hechos mínimos e identificadores internos; excluir secretos y datos innecesarios."

  examples:
    - input:
        usuario: "cliente_001"
        solicitud: "Necesito saber el estado de mi solicitud."
      output:
        respuesta: "Puedes revisar tu solicitud en el portal con el número X."
        acciones:
          - "Consultar historial"
          - "Mostrar estado actual"

  evaluation:
    success_criteria:
      - "La respuesta es útil y clara para el usuario."
      - "La salida cumple con reglas y restricciones del negocio."
      - "Se solicita información faltante cuando es necesario."
      - "Un reintento no duplica efectos y los estados comunicados son verificables."
      - "Los falsos positivos, reversas y fallos quedan medibles y revisables."

  changelog:
    - date: "YYYY-MM-DD"
      change: "Creación o mejora"
      reason: "Motivo del cambio"
